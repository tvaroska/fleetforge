# Google Cloud Build CI pipeline for Fleetforge (OTA firmware management)
#
# Executes parallel verification tracks on E2_HIGHCPU_8:
#   - Track A (t=0): resolve-git-metadata
#   - Track B (t=0): python-lint-typecheck-and-unit-tests (uv + ruff + mypy + firmware/unit pytest)
#   - Track C (t=0): frontend-typecheck-and-tests (npm ci + tsc -b + vitest + vite build)
#   - Fan-in Gate  : docker-build-images builds both production container targets (`api`/`ingestor`
#                    from `Dockerfile` and `frontend` from `frontend/Dockerfile`) only after all
#                    verification tracks pass, and pushes `:${TAG_NAME}` + `:latest` on tag releases.
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml

substitutions:
  _REGION: us-central1
  _AR_REPO: containers
  _BACKEND_IMAGE: ""
  _FRONTEND_IMAGE: ""
  _TAG: ""
  _PUSH: "auto"

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ------------------------------------------------------------------------- #
  # 1. Resolve Git commit & timestamp metadata (t=0)                          #
  # ------------------------------------------------------------------------- #
  - id: resolve-git-metadata
    name: gcr.io/cloud-builders/git
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CB_COMMIT="${COMMIT_SHA}"
        SHA="$${CB_COMMIT:-$$(git rev-parse --short=12 HEAD 2>/dev/null || echo 'local')}"
        BUILT_AT="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        printf '%s' "$${SHA}" > /workspace/.resolved_sha
        printf '%s' "$${BUILT_AT}" > /workspace/.built_at
        printf "Resolved commit=%s built_at=%s\n" "$${SHA}" "$${BUILT_AT}"

  # ------------------------------------------------------------------------- #
  # 2. Python Ruff Lint, Format, Mypy Typecheck & Firmware/Unit Pytest (t=0)  #
  # ------------------------------------------------------------------------- #
  - id: python-lint-typecheck-and-unit-tests
    name: ghcr.io/astral-sh/uv:0.9.1-python3.12-bookworm
    waitFor: ["-"]
    entrypoint: bash
    env:
      - UV_COMPILE_BYTECODE=1
      - UV_LINK_MODE=copy
      - UV_PROJECT_ENVIRONMENT=/workspace/.venv
      - PYTHONPATH=/workspace/src:/workspace
    args:
      - -c
      - |
        set -euo pipefail
        uv sync --frozen --no-install-project
        /workspace/.venv/bin/ruff check .
        /workspace/.venv/bin/ruff format --check .
        /workspace/.venv/bin/mypy src/
        /workspace/.venv/bin/pytest \
          -k "not (TestCiCdDatabaseAndApi or TestTrack1 and database)" \
          -q

  # ------------------------------------------------------------------------- #
  # 3. Frontend TypeScript Check, Vitest Suite & Production Bundle Build (t=0)#
  # ------------------------------------------------------------------------- #
  - id: frontend-typecheck-and-tests
    name: node:22-slim
    waitFor: ["-"]
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm ci
        npm run typecheck
        npm test -- --exclude src/flash.test.tsx
        npm run build

  # ------------------------------------------------------------------------- #
  # 4. Build & Push Production Container Images (Gated on All Verification)   #
  # ------------------------------------------------------------------------- #
  - id: docker-build-images
    name: gcr.io/cloud-builders/docker
    waitFor:
      - resolve-git-metadata
      - python-lint-typecheck-and-unit-tests
      - frontend-typecheck-and-tests
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        SHA="$$(cat /workspace/.resolved_sha)"
        BUILT_AT="$$(cat /workspace/.built_at)"
        CB_TAG_NAME="${TAG_NAME}"
        CB_MANUAL_TAG="${_TAG}"
        CB_TAG="$${CB_TAG_NAME:-$${CB_MANUAL_TAG}}"
        CB_BACKEND="${_BACKEND_IMAGE}"
        CB_FRONTEND="${_FRONTEND_IMAGE}"
        BACKEND_REPO="$${CB_BACKEND:-${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/fleetforge}"
        FRONTEND_REPO="$${CB_FRONTEND:-${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/fleetforge-frontend}"
        BACKEND_TAG="$${BACKEND_REPO}:$${SHA}"
        FRONTEND_TAG="$${FRONTEND_REPO}:$${SHA}"
        docker build \
          --target production \
          --build-arg SOURCE_COMMIT="$${SHA}" \
          --build-arg BUILT_AT="$${BUILT_AT}" \
          -t "fleetforge-api:ci" \
          -t "$${BACKEND_TAG}" \
          -f Dockerfile \
          .
        docker build \
          --target production \
          --build-arg SOURCE_COMMIT="$${SHA}" \
          --build-arg BUILT_AT="$${BUILT_AT}" \
          -t "fleetforge-frontend:ci" \
          -t "$${FRONTEND_TAG}" \
          -f frontend/Dockerfile \
          frontend

  - id: verify-nonroot-and-healthcheck
    name: gcr.io/cloud-builders/docker
    waitFor:
      - docker-build-images
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "Verifying non-root users on fleetforge-api:ci and fleetforge-frontend:ci..."
        API_UID="$$(docker run --rm --entrypoint id fleetforge-api:ci -u)"
        FE_UID="$$(docker run --rm --entrypoint id fleetforge-frontend:ci -u)"
        test "$${API_UID}" != "0"
        test "$${FE_UID}" != "0"
        echo "Starting fleetforge-api-smoke and fleetforge-frontend-smoke containers..."
        docker run -d --name fleetforge-api-smoke fleetforge-api:ci
        docker run -d --name fleetforge-frontend-smoke --add-host api:127.0.0.1 fleetforge-frontend:ci
        trap "docker rm -f fleetforge-api-smoke fleetforge-frontend-smoke >/dev/null 2>&1 || true" EXIT
        for i in $$(seq 1 20); do
          if docker exec fleetforge-api-smoke curl -fsS http://127.0.0.1:8000/v1/healthz >/dev/null \
            && docker exec fleetforge-frontend-smoke wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null; then
            echo "Health probes (/v1/healthz and /nginx-health) passed on attempt $$i"
            exit 0
          fi
          sleep 1
        done
        docker logs fleetforge-api-smoke || true
        docker logs fleetforge-frontend-smoke || true
        exit 1

  - id: trivy-vulnerability-scan
    name: gcr.io/cloud-builders/docker
    waitFor:
      - docker-build-images
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        for IMG in fleetforge-api:ci fleetforge-frontend:ci; do
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --scanners vuln \
            --pkg-types os \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$${IMG}"
        done

  - id: push-release-images
    name: gcr.io/cloud-builders/docker
    waitFor:
      - verify-nonroot-and-healthcheck
      - trivy-vulnerability-scan
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SHA="$$(cat /workspace/.resolved_sha)"
        CB_TAG_NAME="${TAG_NAME}"
        CB_MANUAL_TAG="${_TAG}"
        CB_TAG="$${CB_TAG_NAME:-$${CB_MANUAL_TAG}}"
        CB_BACKEND="${_BACKEND_IMAGE}"
        CB_FRONTEND="${_FRONTEND_IMAGE}"
        BACKEND_REPO="$${CB_BACKEND:-${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/fleetforge}"
        FRONTEND_REPO="$${CB_FRONTEND:-${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/fleetforge-frontend}"
        BACKEND_TAG="$${BACKEND_REPO}:$${SHA}"
        FRONTEND_TAG="$${FRONTEND_REPO}:$${SHA}"
        if [[ -n "$${CB_TAG}" || "${_PUSH}" == "true" ]]; then
          if [[ -n "$${CB_TAG}" ]]; then
            docker tag "$${BACKEND_TAG}" "$${BACKEND_REPO}:$${CB_TAG}"
            docker tag "$${FRONTEND_TAG}" "$${FRONTEND_REPO}:$${CB_TAG}"
            docker push "$${BACKEND_REPO}:$${CB_TAG}"
            docker push "$${FRONTEND_REPO}:$${CB_TAG}"
          fi
          docker push "$${BACKEND_TAG}"
          docker push "$${FRONTEND_TAG}"
          if [[ "$${CB_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker tag "$${BACKEND_TAG}" "$${BACKEND_REPO}:latest"
            docker tag "$${FRONTEND_TAG}" "$${FRONTEND_REPO}:latest"
            docker push "$${BACKEND_REPO}:latest"
            docker push "$${FRONTEND_REPO}:latest"
          fi
        else
          echo "Skipping Artifact Registry push (TAG_NAME and _TAG are empty and _PUSH=${_PUSH})"
        fi

  - id: flux-reconcile
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ops-flux-cli:v2.4.0
    waitFor:
      - push-release-images
    args:
      - "${TAG_NAME}"
      - "${_TAG}"
      - "fleetforge,fleetforge-frontend"
      - "fleetforge-api,fleetforge-ingestor,fleetforge-frontend"
