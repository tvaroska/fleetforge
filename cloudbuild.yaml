# Google Cloud Build CI pipeline for Fleetforge (OTA firmware management)
#
# Executes parallel verification tracks on E2_HIGHCPU_8:
#   - Track A (t=0): resolve-git-metadata
#   - Track B (t=0): python-lint-typecheck-and-unit-tests (uv + ruff + mypy + firmware/unit pytest)
#   - Track C (t=0): frontend-typecheck-and-tests (npm ci + tsc -b + vitest + vite build)
#   - Fan-in Gate  : docker-build-images builds both production container targets (`api`/`ingestor`
#                    from `Dockerfile` and `frontend` from `frontend/Dockerfile`) only after all
#                    verification tracks pass, and pushes `:${TAG_NAME}` + `:latest` on tag releases.
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml

substitutions:
  _REGION: us-central1
  _AR_REPO: containers
  _BACKEND_IMAGE: ""
  _FRONTEND_IMAGE: ""
  _TAG: ""
  _PUSH: "auto"

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ------------------------------------------------------------------------- #
  # 1. Resolve Git commit & timestamp metadata (t=0)                          #
  # ------------------------------------------------------------------------- #
  - id: resolve-git-metadata
    name: gcr.io/cloud-builders/git
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CB_COMMIT="${COMMIT_SHA}"
        SHA="$${CB_COMMIT:-$$(git rev-parse --short=12 HEAD 2>/dev/null || echo 'local')}"
        BUILT_AT="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        printf '%s' "$${SHA}" > /workspace/.resolved_sha
        printf '%s' "$${BUILT_AT}" > /workspace/.built_at
        printf "Resolved commit=%s built_at=%s\n" "$${SHA}" "$${BUILT_AT}"

  # ------------------------------------------------------------------------- #
  # 2. Start Ephemeral PostgreSQL 17 & MinIO Services on Cloud Build Network  #
  # ------------------------------------------------------------------------- #
  - id: start-test-services
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker run -d --network=cloudbuild --name=ci-postgres \
          -e POSTGRES_USER=fleetforge \
          -e POSTGRES_PASSWORD=fleetforge \
          -e POSTGRES_DB=fleetforge \
          postgres:17-alpine -c fsync=off
        docker run -d --network=cloudbuild --name=ci-minio \
          -u 0 \
          -e MINIO_ROOT_USER=fleetforge \
          -e MINIO_ROOT_PASSWORD=fleetforge-dev-only \
          cgr.dev/chainguard/minio:latest-dev@sha256:8d5a0265f0e18fb3b29f95598147f1cc2a86b782181668bad176b0e90cce9569 \
          server /data --console-address ":9001"
        for i in $$(seq 1 30); do
          if docker exec ci-postgres pg_isready -U fleetforge -d fleetforge >/dev/null 2>&1 \
            && docker exec ci-minio wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done
        docker exec ci-postgres pg_isready -U fleetforge -d fleetforge
        docker exec ci-minio wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live

  # ------------------------------------------------------------------------- #
  # 3. Python Ruff Lint, Format, Mypy Typecheck & Full DB/Unit Pytest         #
  #    (Note: release firmware bundles require FF_OTA_PRODUCTION_BUILD=1)     #
  # ------------------------------------------------------------------------- #
  - id: python-lint-typecheck-and-unit-tests
    name: ghcr.io/astral-sh/uv:0.12.24-python3.12-trixie
    waitFor:
      - start-test-services
    entrypoint: bash
    env:
      - UV_COMPILE_BYTECODE=1
      - UV_LINK_MODE=copy
      - UV_PROJECT_ENVIRONMENT=/workspace/.venv
      - PYTHONPATH=/workspace/src:/workspace
      - TEST_DATABASE_URL=postgresql+asyncpg://fleetforge:fleetforge@ci-postgres:5432/fleetforge_test
      - FF_RUN_MINIO_TESTS=1
      - MINIO_HOST=ci-minio
      - S3_ENDPOINT_URL=http://ci-minio:9000
      - S3_PUBLIC_ENDPOINT_URL=http://ci-minio:9000
      - S3_ACCESS_KEY=fleetforge
      - S3_SECRET_KEY=fleetforge-dev-only
      - S3_BUCKET=fleetforge
      - FF_SKIP_FRONTEND_GATE=1
    args:
      - -c
      - |
        set -euo pipefail
        uv sync --frozen --no-install-project
        /workspace/.venv/bin/python -c "import boto3; boto3.client('s3', endpoint_url='http://ci-minio:9000', aws_access_key_id='fleetforge', aws_secret_access_key='fleetforge-dev-only', region_name='us-east-1').create_bucket(Bucket='fleetforge')"
        bash /workspace/scripts/ci_gate.sh

  # ------------------------------------------------------------------------- #
  # 3. Frontend TypeScript Check, Vitest Suite & Production Bundle Build (t=0)#
  # ------------------------------------------------------------------------- #
  - id: frontend-typecheck-and-tests
    name: node:22-slim
    waitFor: ["-"]
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm ci
        npm run typecheck
        npm test
        npm run build

  # ------------------------------------------------------------------------- #
  # 4. Build & Push Production Container Images (Gated on All Verification)   #
  # ------------------------------------------------------------------------- #
  - id: docker-build-images
    name: gcr.io/cloud-builders/docker
    waitFor:
      - resolve-git-metadata
      - python-lint-typecheck-and-unit-tests
      - frontend-typecheck-and-tests
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        SHA="$$(cat /workspace/.resolved_sha)"
        BUILT_AT="$$(cat /workspace/.built_at)"
        CB_TAG_NAME="${TAG_NAME}"
        CB_MANUAL_TAG="${_TAG}"
        CB_TAG="$${CB_TAG_NAME:-$${CB_MANUAL_TAG}}"
        CB_BACKEND="${_BACKEND_IMAGE}"
        CB_FRONTEND="${_FRONTEND_IMAGE}"
        BACKEND_REPO="$${CB_BACKEND:-${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/fleetforge}"
        FRONTEND_REPO="$${CB_FRONTEND:-${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/fleetforge-frontend}"
        BACKEND_TAG="$${BACKEND_REPO}:$${SHA}"
        FRONTEND_TAG="$${FRONTEND_REPO}:$${SHA}"
        docker build \
          --target production \
          --build-arg SOURCE_COMMIT="$${SHA}" \
          --build-arg BUILT_AT="$${BUILT_AT}" \
          -t "fleetforge-api:ci" \
          -t "$${BACKEND_TAG}" \
          -f Dockerfile \
          .
        docker build \
          --target production \
          --build-arg SOURCE_COMMIT="$${SHA}" \
          --build-arg BUILT_AT="$${BUILT_AT}" \
          -t "fleetforge-frontend:ci" \
          -t "$${FRONTEND_TAG}" \
          -f frontend/Dockerfile \
          frontend

  - id: verify-nonroot-and-healthcheck
    name: gcr.io/cloud-builders/docker
    waitFor:
      - docker-build-images
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "Verifying non-root users on fleetforge-api:ci and fleetforge-frontend:ci..."
        API_UID="$$(docker run --rm --entrypoint id fleetforge-api:ci -u)"
        FE_UID="$$(docker run --rm --entrypoint id fleetforge-frontend:ci -u)"
        test "$${API_UID}" != "0"
        test "$${FE_UID}" != "0"
        echo "Starting fleetforge-api-smoke and fleetforge-frontend-smoke containers..."
        docker run -d --network=cloudbuild --name fleetforge-api-smoke \
          -e DATABASE_URL=postgresql+asyncpg://fleetforge:fleetforge@ci-postgres:5432/fleetforge \
          -e RUN_MIGRATIONS=true \
          -e S3_ENDPOINT_URL=http://ci-minio:9000 \
          -e S3_PUBLIC_ENDPOINT_URL=http://ci-minio:9000 \
          -e S3_ACCESS_KEY=fleetforge \
          -e S3_SECRET_KEY=fleetforge-dev-only \
          -e S3_BUCKET=fleetforge \
          -e ARTIFACT_URL_SECRET=ci-smoke-artifact-url-secret-0123456789 \
          -e SECRETS_ENCRYPTION_KEY=ci-smoke-secrets-encryption-key-012345 \
          -e PUBLIC_BASE_URL=http://localhost:8080 \
          -e MQTT_COMMAND_USERNAME=ff-commander \
          -e MQTT_COMMAND_PASSWORD=ci-smoke-mqtt-pass \
          fleetforge-api:ci
        docker run -d --network=cloudbuild --name fleetforge-frontend-smoke \
          --link fleetforge-api-smoke:api \
          fleetforge-frontend:ci
        trap "docker rm -f fleetforge-api-smoke fleetforge-frontend-smoke >/dev/null 2>&1 || true" EXIT
        for i in $$(seq 1 30); do
          if docker exec fleetforge-api-smoke curl -fsS http://127.0.0.1:8000/v1/healthz >/dev/null \
            && docker exec fleetforge-api-smoke curl -fsS http://127.0.0.1:8000/v1/readyz >/dev/null \
            && docker exec fleetforge-frontend-smoke wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null; then
            echo "Health & readiness probes (/v1/healthz, /v1/readyz, /nginx-health) passed on attempt $$i"
            exit 0
          fi
          sleep 1
        done
        docker logs fleetforge-api-smoke || true
        docker logs fleetforge-frontend-smoke || true
        exit 1

  - id: trivy-vulnerability-scan
    name: gcr.io/cloud-builders/docker
    waitFor:
      - docker-build-images
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        for IMG in fleetforge-api:ci fleetforge-frontend:ci; do
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$${IMG}"
        done

  - id: push-release-images
    name: gcr.io/cloud-builders/docker
    waitFor:
      - verify-nonroot-and-healthcheck
      - trivy-vulnerability-scan
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SHA="$$(cat /workspace/.resolved_sha)"
        CB_TAG_NAME="${TAG_NAME}"
        CB_MANUAL_TAG="${_TAG}"
        CB_TAG="$${CB_TAG_NAME:-$${CB_MANUAL_TAG}}"
        CB_BACKEND="${_BACKEND_IMAGE}"
        CB_FRONTEND="${_FRONTEND_IMAGE}"
        BACKEND_REPO="$${CB_BACKEND:-${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/fleetforge}"
        FRONTEND_REPO="$${CB_FRONTEND:-${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/fleetforge-frontend}"
        BACKEND_TAG="$${BACKEND_REPO}:$${SHA}"
        FRONTEND_TAG="$${FRONTEND_REPO}:$${SHA}"
        if [[ -n "$${CB_TAG}" || "${_PUSH}" == "true" ]]; then
          if [[ -n "$${CB_TAG}" ]]; then
            docker tag "$${BACKEND_TAG}" "$${BACKEND_REPO}:$${CB_TAG}"
            docker tag "$${FRONTEND_TAG}" "$${FRONTEND_REPO}:$${CB_TAG}"
            docker push "$${BACKEND_REPO}:$${CB_TAG}"
            docker push "$${FRONTEND_REPO}:$${CB_TAG}"
          fi
          docker push "$${BACKEND_TAG}"
          docker push "$${FRONTEND_TAG}"
          if [[ "$${CB_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker tag "$${BACKEND_TAG}" "$${BACKEND_REPO}:latest"
            docker tag "$${FRONTEND_TAG}" "$${FRONTEND_REPO}:latest"
            docker push "$${BACKEND_REPO}:latest"
            docker push "$${FRONTEND_REPO}:latest"
          fi
        else
          echo "Skipping Artifact Registry push (TAG_NAME and _TAG are empty and _PUSH=${_PUSH})"
        fi

  - id: flux-reconcile
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/ops-flux-cli:v2.4.0
    waitFor:
      - push-release-images
    args:
      - "${TAG_NAME}"
      - "${_TAG}"
      - "fleetforge,fleetforge-frontend"
      - "fleetforge-api,fleetforge-ingestor,fleetforge-frontend"

  # Mirror vX.Y.Z release images to GHCR for the k3s cluster; both steps
  # skip cleanly (exit 0) until the ghcr-push-token secret exists.
  - id: ghcr-token
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    waitFor:
      - push-release-images
    allowFailure: true
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CB_TAG_NAME="${TAG_NAME}"
        CB_MANUAL_TAG="${_TAG}"
        CB_TAG="$${CB_TAG_NAME:-$${CB_MANUAL_TAG}}"
        if [[ ! "$${CB_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Skipping GHCR mirror (release tag '$${CB_TAG}' is not vX.Y.Z)"
          exit 0
        fi
        if ! gcloud secrets versions access latest --secret=ghcr-push-token --project=${PROJECT_ID} > /workspace/.ghcr-token; then
          rm -f /workspace/.ghcr-token
          echo "ghcr-push-token not available; skipping GHCR mirror"
          exit 0
        fi

  - id: mirror-to-ghcr
    name: gcr.io/cloud-builders/docker
    waitFor:
      - ghcr-token
    allowFailure: true
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ ! -s /workspace/.ghcr-token ]]; then
          rm -f /workspace/.ghcr-token
          echo "No GHCR token resolved; skipping GHCR mirror"
          exit 0
        fi
        CB_TAG_NAME="${TAG_NAME}"
        CB_MANUAL_TAG="${_TAG}"
        CB_TAG="$${CB_TAG_NAME:-$${CB_MANUAL_TAG}}"
        CB_BACKEND="${_BACKEND_IMAGE}"
        CB_FRONTEND="${_FRONTEND_IMAGE}"
        BACKEND_REPO="$${CB_BACKEND:-${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/fleetforge}"
        FRONTEND_REPO="$${CB_FRONTEND:-${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/fleetforge-frontend}"
        docker login ghcr.io -u tvaroska --password-stdin < /workspace/.ghcr-token
        rm -f /workspace/.ghcr-token
        docker pull "$${BACKEND_REPO}:$${CB_TAG}"
        docker tag "$${BACKEND_REPO}:$${CB_TAG}" "ghcr.io/tvaroska/fleetforge:$${CB_TAG}"
        docker push "ghcr.io/tvaroska/fleetforge:$${CB_TAG}"
        docker pull "$${FRONTEND_REPO}:$${CB_TAG}"
        docker tag "$${FRONTEND_REPO}:$${CB_TAG}" "ghcr.io/tvaroska/fleetforge-frontend:$${CB_TAG}"
        docker push "ghcr.io/tvaroska/fleetforge-frontend:$${CB_TAG}"
