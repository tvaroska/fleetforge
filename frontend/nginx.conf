# =============================================================================
# The one-origin server block.
# =============================================================================
# nginx serves the SPA and proxies /v1/* to the API in the same container
# network — design/production.md -> "Same origin, two backends", the shape
# bingo-frontend used with BACKEND_URL. Hardcoded to http://api:8000 because this
# stack has no envsubst entrypoint and does not need one; the production fragment
# (R0-infra-3) uses the same service name.
#
# `frontend/vite.config.ts` proxies /v1 the same way for the dev server. Keep the
# two in agreement: a browser CORS error against this app means THIS proxy is
# misconfigured, never that the API is missing CORS middleware.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable temp paths, so the server can run as the unprivileged nginx user.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server_tokens off;

    log_format json_combined escape=json
        '{"time":"$time_local","ip":"$remote_addr","request":"$request",'
        '"status":$status,"bytes":$body_bytes_sent,"time_ms":$request_time}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml font/ttf font/otf font/woff font/woff2;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Container healthcheck target. Never proxied — it must answer while the
        # API is still starting.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 'healthy\n';
        }

        # --- The API, on this page's own origin -----------------------------
        location /v1/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE (R0-be-5). These four lines are the non-obvious part: nginx
            # buffers proxied responses by default, so an event stream would sit
            # in the buffer until it filled — R0-be-5 would look correct in curl
            # against the API and be broken through the dashboard, missing
            # spec/prd.md's "<= 2 s to reflect a state change" target. Do not let
            # a tidy-up remove them.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # Vite emits content-hashed filenames, so these are immutable.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location / {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # Minimal on purpose. `connect-src 'self'` is what the same-origin
            # /v1 fetches and the R0-be-5 SSE stream need; nothing loads from a
            # third party. R0-fe-3 must confirm Web Serial still works under it
            # (it should — Web Serial is not CSP-gated), and must NOT be blocked
            # by a Permissions-Policy: `serial` is deliberately not restricted.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
