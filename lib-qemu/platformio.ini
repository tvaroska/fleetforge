; QEMU harness for the Arduino library (R3-fw-3): `just lib-bundle` then `just lib-qemu`.
; NEVER ship a binary built here.
;
; It builds the SAME sketch, partition table and library as
; agent/components/fleetforge/examples/Basic/platformio.ini's env:esp32, with exactly one
; delta: QEMU's esp32 machine has one NIC, the OpenCores Ethernet MAC, and the stock
; Arduino libraries are built without its driver. `custom_sdkconfig` turns it on, the same
; one-line delta agent/sdkconfig.defaults.esp32 carries for the agent.
; tests/test_arduino_library.py pins both: every other key equals env:esp32's.
;
; Why a separate project. `custom_sdkconfig` makes pioarduino rebuild the Arduino
; libraries from ESP-IDF ("hybrid compile", ~10 min the first time) INTO the shared
; package directory, and writes .dummy/, managed_components/, sdkconfig.defaults and
; sdkconfig.<env> into the project folder. Here those land in lib-qemu/ (ignored) instead
; of the example a maker copies, and outside agent/ (the IDF build context, and a tree the
; agent tests scan file by file); and `just lib-bundle` runs this project with its
; own PLATFORMIO_CORE_DIR, so the persona builds' packages stay stock. Without that, every
; switch between this env and env:esp32 makes pioarduino delete and re-download the
; Arduino framework.

[platformio]
src_dir = ../agent/components/fleetforge/examples/Basic
default_envs = esp32-qemu

[env:esp32-qemu]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<*.ino.cpp>
board_build.partitions = ../agent/components/fleetforge/examples/Basic/partitions.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
lib_deps = symlink://../agent/components/fleetforge
board = esp32dev
custom_sdkconfig = CONFIG_ETH_USE_OPENETH=y
