# Google Cloud Build pipeline for compiling build/{{APP_NAME}}.bin (`just cloud-build`).
steps:
  - name: "espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        . $$IDF_PATH/export.sh
        idf.py set-target {{TARGET}}
        idf.py build

artifacts:
  objects:
    location: "${_ARTIFACT_URI}"
    paths:
      - "build/{{APP_NAME}}.bin"

substitutions:
  _ARTIFACT_URI: "gs://{{GCP_PROJECT}}_cloudbuild/{{APP_NAME}}"

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
