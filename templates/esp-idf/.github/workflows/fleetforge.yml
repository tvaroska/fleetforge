name: Build & Push Firmware to Fleetforge

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  repository_dispatch:
    types: [fleetforge-build]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or commit) to build and push"
        required: false
      deploy:
        description: "Explicit deploy target after upload (off, dev, all)"
        required: false
        default: "off"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.event.client_payload.track_ref || github.ref }}

      - name: Build ESP-IDF firmware ({{TARGET}})
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          idf.py set-target {{TARGET}}
          idf.py build
          ls -lh build/{{APP_NAME}}.bin

      - name: Upload build/{{APP_NAME}}.bin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: {{APP_NAME}}-{{TARGET}}-bin
          path: build/{{APP_NAME}}.bin

      - name: Push build/{{APP_NAME}}.bin to Fleetforge
        if: ${{ secrets.FLEETFORGE_TOKEN != '' }}
        shell: bash
        env:
          FLEETFORGE_URL: ${{ vars.FLEETFORGE_URL || '{{FLEETFORGE_URL}}' }}
          FLEETFORGE_TOKEN: ${{ secrets.FLEETFORGE_TOKEN }}
          DEPLOY_TARGET: ${{ github.event.inputs.deploy || 'off' }}
        run: |
          set -euo pipefail
          BASE_VER="$(sed -n 's/^set(PROJECT_VER "\(.*\)")/\1/p' CMakeLists.txt)"
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"
          TAG=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="${BASE_VER}-${SHORT_SHA}"
          fi
          BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          export VERSION BRANCH TAG BUILD_URL
          QUERY="$(python3 -c 'import os, urllib.parse; print(urllib.parse.urlencode([("project", "{{PROJECT_SLUG}}"), ("target", "{{TARGET}}"), ("version", os.environ["VERSION"]), ("partition_layout", "ab-4m-v1"), ("repo_url", os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"]), ("branch", os.environ["BRANCH"]), ("commit_sha", os.environ["GITHUB_SHA"]), ("tag", os.environ["TAG"]), ("build_url", os.environ["BUILD_URL"])]))')"

          curl --fail-with-body -X POST \
            "${FLEETFORGE_URL%/}/v1/artifact?${QUERY}" \
            -H "Authorization: Bearer ${FLEETFORGE_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@build/{{APP_NAME}}.bin"

          if [[ "${DEPLOY_TARGET}" == "dev" || "${DEPLOY_TARGET}" == "all" ]]; then
            DEPLOY_BODY="$(python3 -c 'import json, os; print(json.dumps({"version": os.environ["VERSION"], "target_filter": os.environ["DEPLOY_TARGET"], "apply": "auto"}))')"
            curl --fail-with-body -X POST \
              "${FLEETFORGE_URL%/}/v1/projects/{{PROJECT_SLUG}}/deploy" \
              -H "Authorization: Bearer ${FLEETFORGE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${DEPLOY_BODY}"
          fi
