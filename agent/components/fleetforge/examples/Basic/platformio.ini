; The build harness for the Basic example (R3-fw-3): `just lib-build esp32|esp32s3`.
; R3-fw-7 owns the clean-checkout `pio run` recipe and its README; this file is what the
; library's own compile proof runs on. The QEMU build is a separate project,
; lib-qemu/platformio.ini, so this folder stays exactly what a maker copies.
;
; The platform is pinned to one exact pioarduino release: Arduino-ESP32 core 3.3.12 on
; ESP-IDF v5.5.5, the agent's own IDF and the core ab-4m-arduino-v1 was measured on
; (R3-fw-1). PlatformIO's official espressif32 platform ships core 2.x (IDF 4.4), which
; the component does not support. Never `stable`: a core bump re-opens the layout
; measurement (design/decisions/arduino-gets-its-own-layout-id.md).

[platformio]
src_dir = .
default_envs = esp32, esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Only the sketch compiles from this folder (PlatformIO turns Basic.ino into a top-level
; Basic.ino.cpp for the build), never anything under .pio/.
build_src_filter = -<*> +<*.ino.cpp>
; Required: PlatformIO does not apply the Arduino IDE's sketch-folder prebuild hook.
board_build.partitions = partitions.csv
; ab-4m-arduino-v1 is a 4 MB map.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
; The library is the component directory two levels up (library.json).
lib_deps = symlink://../..

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
