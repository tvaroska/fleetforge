[project]
name = "fleetforge"
version = "0.4.1"
description = "OTA firmware management for embedded fleets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.45,<3.0",
    "asyncpg>=0.31.0,<1.0",
    "alembic>=1.16,<2.0",
    "pydantic-settings>=2.4.0,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "aiomqtt>=2.3,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "boto3>=1.43.90",
    "google-cloud-storage>=3.14.1",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2.0",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.8.6,<1.0",
    "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Tests share the session-scoped loop; the session-scoped engine's connections
# cannot be awaited from a different loop.
asyncio_default_test_loop_scope = "session"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
no_implicit_optional = true

# asyncpg ships no `py.typed` marker. Everything else reaches it through
# SQLAlchemy; the one direct user is `api/eventstream.py`'s dedicated `LISTEN`
# connection (`LISTEN` cannot share the pool — see DECISIONS.md, R0-be-5). One
# config line beats a `# type: ignore` on every call into it.
[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

# Neither object-store SDK ships usable types (boto3/botocore's are generated by
# separate stub packages; google-cloud-storage's are partial). `warn_return_any` is on,
# so `storage/*.py` coerces SDK return values explicitly (`str(url)`, `bytes(body)`)
# rather than sprinkling `# type: ignore` at every call site. The `google.cloud.*`
# override follows the `content` repo's precedent.
[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "google.cloud.*",
    "google.api_core.*",
    "google.auth.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# Alembic's env.py must extend sys.path before importing the app package.
"alembic/env.py" = ["E402"]
"alembic/versions/*" = ["E402"]
# agent/tools/ runs in the ESP-IDF builder image (no venv); subprocess calls git with fixed args.
"agent/tools/*" = ["S603", "S607"]
