[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetforge"
version = "0.9.5"
description = "OTA firmware management for embedded fleets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.45,<3.0",
    "asyncpg>=0.31.0,<1.0",
    "alembic>=1.16,<2.0",
    "pydantic-settings>=2.4.0,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "aiomqtt>=2.3,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "boto3>=1.43.90",
    "google-cloud-storage>=3.14.1",
    # Runtime, not dev: Firebase/OTLP HTTP calls (api/routers/projects.py,
    # ingestor/otel.py) and at-rest secret encryption (secrets_crypto.py).
    "httpx>=0.28,<1.0",
    "cryptography>=50.0",
]

[project.scripts]
fleetforge = "fleetforge.cli:main"

[tool.uv]
required-version = ">=0.12.0"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetforge"]

[dependency-groups]
dev = [
    "mypy>=1.19,<2.0",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=7.0,<8.0",
    "pytest-xdist>=3.8,<4.0",
    "ruff>=0.8.6,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Tests share the session-scoped loop; the session-scoped engine's connections
# cannot be awaited from a different loop.
asyncio_default_test_loop_scope = "session"
markers = [
    "smoke: fast sanity checks covering critical startup and health invariants",
    "unit: pure in-process unit tests with no external services",
    "port: parameterized Port conformance suites shared by fakes and real adapters",
    "integration: tests requiring live infrastructure (PostgreSQL, MinIO, broker, Docker, QEMU)",
    "e2e: full-stack or browser end-to-end verification tests",
]

[tool.coverage.run]
source = ["src/fleetforge"]
branch = true
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
exclude_also = [
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "class .*\\bProtocol\\):",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
no_implicit_optional = true

# asyncpg ships no `py.typed` marker. Everything else reaches it through
# SQLAlchemy; the one direct user is `api/eventstream.py`'s dedicated `LISTEN`
# connection (`LISTEN` cannot share the pool — see DECISIONS.md, R0-be-5). One
# config line beats a `# type: ignore` on every call into it.
[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

# Neither object-store SDK ships usable types (boto3/botocore's are generated by
# separate stub packages; google-cloud-storage's are partial). `warn_return_any` is on,
# so `storage/*.py` coerces SDK return values explicitly (`str(url)`, `bytes(body)`)
# rather than sprinkling `# type: ignore` at every call site. The `google.cloud.*`
# override follows the `content` repo's precedent.
[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "google.cloud.*",
    "google.api_core.*",
    "google.auth.*",
    "idf_py_actions.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# Alembic's env.py must extend sys.path before importing the app package.
"alembic/env.py" = ["E402"]
"alembic/versions/*" = ["E402"]
# agent/tools/ runs in the ESP-IDF builder image (no venv); subprocess calls git with fixed args.
"agent/tools/*" = ["S603", "S607"]
# scripts/lib_quickstart.py drives git, docker, just and bash with fixed argv, and talks to the
# dev API over urllib at an http(s) origin the operator passes (R3-fw-4).
"scripts/lib_quickstart.py" = ["S603", "S607", "S310"]
# scripts/selftest_window_e2e.py starts `uv run` simulators with fixed argv, talks to the dev API
# over urllib at the origin the operator passes, and keeps evidence in /tmp/ff-r5-test-1 (R5-test-1).
"scripts/selftest_window_e2e.py" = ["S603", "S607", "S310", "S108"]
# scripts/arduino_ide_check.py runs the pinned arduino-cli, nm and df with fixed argv, in a
# scratch toolchain whose default is the runbook's fixed /tmp/ff-arduino-ide (R3-fw-8).
"scripts/arduino_ide_check.py" = ["S603", "S607", "S108"]
# src/fleetforge/cli_{client,templates}.py invoke git with fixed argv and talk over urllib.
"src/fleetforge/cli_client.py" = ["S603", "S607", "S310"]
"src/fleetforge/cli_templates.py" = ["S310"]
