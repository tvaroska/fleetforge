[project]
name = "fleetforge"
version = "0.1.0"
description = "OTA firmware management for embedded fleets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.45,<3.0",
    "asyncpg>=0.31.0,<1.0",
    "alembic>=1.16,<2.0",
    "pydantic-settings>=2.4.0,<3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2.0",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.8.6,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Tests share the session-scoped loop; the session-scoped engine's connections
# cannot be awaited from a different loop.
asyncio_default_test_loop_scope = "session"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
no_implicit_optional = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# Alembic's env.py must extend sys.path before importing the app package.
"alembic/env.py" = ["E402"]
"alembic/versions/*" = ["E402"]
