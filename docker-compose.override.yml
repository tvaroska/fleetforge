# =============================================================================
# Dev conveniences. Loaded automatically by `docker compose up` (`just up`).
# =============================================================================
# `just up-prod` runs `docker compose -f docker-compose.yml` and therefore SKIPS
# this file, exercising the production-shaped path: built images, nginx, no bind
# mounts, no --reload. Run `just up-prod` before committing — that is the check
# that keeps the V2 self-host artifact honest (design/production.md -> "Two
# deployment artifacts, deliberately").
#
# Note what is NOT here: `env_file: .env`. See the header of docker-compose.yml.
# =============================================================================

services:
  api:
    build:
      target: development
    command:
      ["uvicorn", "fleetforge.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    image: fleetforge:dev-local
    volumes:
      - ./src:/app/src:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      # The agent bundles come from the working tree, not from the image, so
      # `just agent-build <target>` shows up without an app-image rebuild. It still
      # needs an api RESTART: the catalog is read (and every part sha256-verified)
      # once at startup, and uvicorn --reload only watches ./src.
      - ./agent/dist:/app/agent:ro

  ingestor:
    build:
      target: development
    image: fleetforge:dev-local
    volumes:
      - ./src:/app/src:ro

  frontend:
    build:
      target: development
    image: fleetforge-frontend:dev-local
    labels:
      # R0-fw-1. The emulated board reaches this box through QEMU's slirp gateway,
      # so its Host header is `10.0.2.2:8080` and the `Host(localhost)` router in
      # docker-compose.yml does not match it: every `POST /v1/enroll` comes back 404
      # from Traefik, having never reached the api, which reads exactly like a
      # firmware bug. Same backend, second name. DEV ONLY — this file is skipped by
      # `just up-prod` and never deployed (10.0.2.2 is unroutable off this host
      # anyway; it only means anything inside QEMU's NAT).
      traefik.http.routers.ff-qemu.rule: "Host(`10.0.2.2`)"
      traefik.http.routers.ff-qemu.entrypoints: web
      traefik.http.routers.ff-qemu.service: ff-frontend
    environment:
      # Vite >= 6 rejects unknown Host headers; keep this in step with the
      # Traefik Host() rules — the base file's, and ff-qemu's above.
      FF_DOMAIN: ${FF_DOMAIN:-localhost},10.0.2.2
      # The dev server proxies /v1 to the same backend nginx does in production,
      # so the SPA is same-origin in both modes.
      VITE_API_PROXY: http://api:8000
    volumes:
      - ./frontend:/app
      # Named volume, seeded from the image's `npm ci`: without it the bind mount
      # above would hide node_modules.
      #
      # After changing package.json the volume must be DELETED, not rebuilt — Docker
      # seeds a named volume from the image exactly once, when the volume is created,
      # so `just rebuild frontend` produces a correct image that the stale volume then
      # masks. The symptom is a Vite "Failed to resolve import" for a package that is
      # plainly installed on the host (S0-fe-2 lost twenty minutes to it):
      #
      #   docker compose stop frontend && docker compose rm -f frontend
      #   docker volume rm fleetforge_ff_node_modules
      #   just rebuild frontend && docker compose up -d frontend
      - ff_node_modules:/app/node_modules
    healthcheck:
      # The Vite dev server has no /nginx-health, and node:22-slim ships neither
      # wget nor curl — so probe the SPA entrypoint with node's own fetch.
      # Traefik skips containers that are not healthy, so a broken probe here
      # shows up as a 404 from the `web` entrypoint, not as an unhealthy badge.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  ff_node_modules:
