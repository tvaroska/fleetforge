# Base broker configuration.
#
# R0-sec-1 owns authentication and the two %u pattern ACLs. NOTHING IN THIS FILE
# MAY GRANT OR RESTRICT TOPIC ACCESS — all authz lives in conf.d/, so the security
# posture of the broker is one directory listing, not a config audit.

listener 1883
protocol mqtt

# Persistent sessions are how an undelivered QoS-1 command survives a broker
# restart — spec/device-protocol.md -> "Retain and durability". Command durability
# comes from the session, never from a retained dn/cmd message.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# The ingestor reconnects with a stable client id and clean_session=false, so its
# subscription and queued messages must outlive both processes.
max_queued_messages 1000
persistent_client_expiration 7d

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Everything auth-related is a drop-in. R0-sec-1 adds 20-dynsec.conf here and
# deletes 10-dev-anonymous.conf in the same commit.
include_dir /mosquitto/config/conf.d
