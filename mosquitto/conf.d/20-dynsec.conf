# ===========================================================================
#  Fleetforge broker authentication + authorisation. R0-sec-1.
#
#  TWO mechanisms on purpose (see DECISIONS.md 2026-09-08, R0-sec-1):
#
#   * dynamic-security  = WHO EXISTS. Per-device credentials, created by the
#     API at enrolment over $CONTROL/dynamic-security/v1 (broker/dynsec.py).
#     Mutable state, kept in the data volume — /mosquitto/data is a named
#     volume, never a read-only bind mount, and the file must be owned by
#     uid 1883 or the plugin logs "not writable", applies the change in memory
#     anyway, and loses every device credential on the next restart.
#   * acl_file          = WHAT A DEVICE MAY DO. The two %u pattern rules from
#     spec/device-protocol.md. Mosquitto 2.0's dynsec plugin does NOT support
#     %u/%c substitution (verified against 2.0.22), so the fleet ACL cannot
#     live in a dynsec role. Both backends are consulted and ALLOW WINS.
#
#  The dynsec `device` role is deliberately EMPTY: it exists only because
#  createClient requires a role name (broker.DEVICE_ROLE == "device"). Moving
#  the pattern rules into it does not work — it silently denies everything.
#
#  Mosquitto logs a warning that /mosquitto/config/acl is world-readable and
#  not owned by mosquitto. That is expected for a read-only bind mount out of
#  the repo, and it is a warning, not an error.
# ===========================================================================
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

acl_file /mosquitto/config/acl
