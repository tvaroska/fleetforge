# ===========================================================================
#  DEV ONLY — DELETE IN R0-sec-1.
#
#  This is the only line in the repository that grants unauthenticated access to
#  anything. It is quarantined in its own file so that removing it is a deletion,
#  not an audit.
#
#  The broker is on the public internet from R0 (spec/prd.md -> Deployment
#  model), so anonymous access is acceptable ONLY on a localhost dev stack and
#  must never reach the production fragment in the `services` repo.
#
#  R0-sec-1 replaces this file with the Mosquitto dynamic-security plugin and the
#  two pattern ACLs that are the entire fleet authorisation model:
#       pattern write ff/v1/d/%u/up/#
#       pattern read  ff/v1/d/%u/dn/#
#  ...and must update the mosquitto healthcheck in docker-compose.yml in the same
#  commit, or the container goes unhealthy the moment this file disappears.
# ===========================================================================
allow_anonymous true
