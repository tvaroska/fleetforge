# =============================================================================
# The standalone Fleetforge stack.
# =============================================================================
# Traefik + Postgres + MinIO + Mosquitto + api + ingestor + frontend.
#
# This file is BOTH:
#   1. the dev loop — `just up`, used every day, which is exactly why it cannot
#      rot (design/production.md -> "Two deployment artifacts, deliberately"); and
#   2. the V2 self-host artifact — spec/prd.md promises "ships as one Docker
#      Compose stack", so turnkey self-hosting must be a *configuration* change on
#      top of this file, never a rewrite.
#
# Production runs a *fragment* of this in the `services` repo (api, ingestor,
# frontend, mosquitto only — Traefik, Postgres and object storage are shared).
# That fragment is R0-infra-3 and does not live here.
#
# `just up` also applies docker-compose.override.yml (hot reload, Vite dev server).
# `just up-prod` uses this file alone: nginx + the built image, no bind mounts.
# Run `just up-prod` before committing — it is what keeps the self-host artifact
# honest.
#
# NOTE, and this is the one that costs an hour: NO SERVICE USES `env_file: .env`.
# `.env` holds the HOST database URL (localhost:5433) for alembic/pytest/just;
# containers get `postgres:5432` set explicitly below. Compose still reads `.env`
# for ${VAR} interpolation in this file, which is fine — it is `env_file:` that
# would inject the host URL into a container, where pydantic-settings gives real
# environment variables precedence over .env values.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Ingress. Two entrypoints: HTTP for the dashboard, TCP for MQTT.
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.6                      # same major/minor as services/prod
    container_name: fleetforge-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # MQTT gets its own entrypoint and never shares one with `web`: a non-TLS
      # TCP router takes the whole entrypoint (see the mosquitto labels below).
      - --entrypoints.mqtt.address=:8883
      - --api.dashboard=true
      - --api.insecure=true                  # dev only — prod uses socket-proxy and no insecure API
      - --ping=true                          # backs the healthcheck below
      - --log.level=INFO
      - --accesslog=true
      # --- V2 / TLS, deliberately not enabled -------------------------------
      # spec/prd.md -> Deployment model: "Deferred to V2: turnkey self-hosting
      # (the hard part is TLS without public DNS)". http://localhost is already a
      # secure context, so Web Serial (R0-fe-3) and `Secure` cookies (R0-be-1)
      # both work without it. The prod form lives in services/prod (R0-infra-3):
      # - --entrypoints.websecure.address=:443
      # - --certificatesresolvers.myresolver.acme.email=${FF_ACME_EMAIL}
      # - --certificatesresolvers.myresolver.acme.httpchallenge=true
      # - --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web
      # - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    ports:
      - "${FF_HTTP_PORT:-8080}:80"
      - "${FF_MQTT_PORT:-8883}:8883"
      - "${FF_TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      # Read-only socket is the dev shape. Production fronts the socket with a
      # `socket-proxy` container (see services/prod/docker-compose.yml); that is
      # four more services' worth of yaml for a single-user dev box.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # `backend` as well as `frontend`: Traefik must reach mosquitto for the TCP
      # router, and mosquitto is backend-only. R0-infra-3 must add the shared
      # Traefik to the backend network too — today it is on frontend +
      # socket-proxy only.
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Database. Seeded by R0-db-1; unchanged except for joining `backend`.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: fleetforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleetforge
      POSTGRES_PASSWORD: fleetforge      # dev only; prod creds live in services/prod/.env
      POSTGRES_DB: fleetforge
    ports:
      - "5433:5432"                       # 5432 is taken on this host by bridge-postgres
    volumes:
      - fleetforge_pg:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Broker. Reachable ONLY through Traefik's `mqtt` entrypoint — no host port.
  # That is deliberate: it makes the dev path and the prod path the same path.
  # ---------------------------------------------------------------------------
  # One-shot: creates dynamic-security.json + the roles/clients the services
  # need, before the broker starts. Idempotent; safe on every `up`.
  # `mosquitto_ctrl dynsec init` is the only subcommand that works on a file, so
  # the script runs a throwaway broker on 127.0.0.1:1884 to apply the rest.
  mosquitto-init:
    image: eclipse-mosquitto:2.0.22
    container_name: fleetforge-mosquitto-init
    entrypoint: ["sh", "/bootstrap.sh"]
    environment:
      MOSQUITTO_ADMIN_USERNAME: ${MQTT_DYNSEC_USERNAME:?set MQTT_DYNSEC_USERNAME in .env}
      MOSQUITTO_ADMIN_PASSWORD: ${MQTT_DYNSEC_PASSWORD:?set MQTT_DYNSEC_PASSWORD in .env}
      MOSQUITTO_INGESTOR_USERNAME: ${MQTT_INGESTOR_USERNAME:?set MQTT_INGESTOR_USERNAME in .env}
      MOSQUITTO_INGESTOR_PASSWORD: ${MQTT_INGESTOR_PASSWORD:?set MQTT_INGESTOR_PASSWORD in .env}
      # The API's deploy publisher (R1-be-2) — the `commander` role, write-only on
      # `ff/v1/d/+/dn/#`. Mandatory for the same reason as the pair above: with it
      # unset the API selects `NullCommandPublisher` and every deploy answers 503.
      MOSQUITTO_COMMANDER_USERNAME: ${MQTT_COMMAND_USERNAME:?set MQTT_COMMAND_USERNAME in .env}
      MOSQUITTO_COMMANDER_PASSWORD: ${MQTT_COMMAND_PASSWORD:?set MQTT_COMMAND_PASSWORD in .env}
    volumes:
      - ./mosquitto/bootstrap.sh:/bootstrap.sh:ro
      - fleetforge_mosquitto:/mosquitto/data
    networks: [backend]        # not strictly needed; keeps `docker compose config` uniform
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: fleetforge-mosquitto
    restart: unless-stopped
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/conf.d:/mosquitto/config/conf.d:ro
      # NOT inside conf.d/: include_dir only reads *.conf, and a non-config file
      # in a config directory is a trap for the next reader.
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - fleetforge_mosquitto:/mosquitto/data
    environment:
      # For the healthcheck only — the broker itself reads no environment.
      MOSQUITTO_ADMIN_USERNAME: ${MQTT_DYNSEC_USERNAME:?set MQTT_DYNSEC_USERNAME in .env}
      MOSQUITTO_ADMIN_PASSWORD: ${MQTT_DYNSEC_PASSWORD:?set MQTT_DYNSEC_PASSWORD in .env}
    networks:
      - backend
    labels:
      traefik.enable: "true"
      traefik.tcp.routers.ff-mqtt.entrypoints: mqtt
      # A non-TLS TCP router must match HostSNI(`*`) and then owns the whole
      # entrypoint. Production (R0-infra-3, services repo) uses
      #   rule=HostSNI(`bingo.tvaroska.sk`)  +  tls.certresolver=myresolver
      # so Traefik TERMINATES TLS and forwards plaintext to mosquitto:1883 —
      # not passthrough. design/production.md -> "Port 8883".
      traefik.tcp.routers.ff-mqtt.rule: "HostSNI(`*`)"
      traefik.tcp.services.ff-mqtt.loadbalancer.server.port: "1883"
      traefik.docker.network: fleetforge_backend
    healthcheck:
      # Anonymous access is gone (R0-sec-1), so the probe authenticates as the
      # dynsec admin — the only client that exists before any device enrolls and
      # the only one `dynsec init` gives $SYS read. SINGLE-quote the topic:
      # "$SYS/..." inside double quotes expands to "/broker/uptime" and the probe
      # always times out, which Traefik then shows as a 404 on the mqtt
      # entrypoint, not as an unhealthy badge.
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$$MOSQUITTO_ADMIN_USERNAME\" -P \"$$MOSQUITTO_ADMIN_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M      # design/production.md -> Capacity; R0-infra-4 measures it

  # ---------------------------------------------------------------------------
  # Object storage. The self-hosted sibling of GCS behind the R0-be-6 adapter.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z    # pinned: MinIO tags churn, and newer releases dropped the console
    container_name: fleetforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fleetforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fleetforge-dev-only}
    ports:
      - "${FF_MINIO_PORT:-9000}:9000"
      - "${FF_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - fleetforge_minio:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot, idempotent bucket creation: `just up` twice must be safe.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: fleetforge-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fleetforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fleetforge-dev-only}
      S3_BUCKET: ${S3_BUCKET:-fleetforge}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc ls local/
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # The HTTP control plane. NOT routed by Traefik and NOT on the frontend
  # network: nginx in the `frontend` container owns /v1 on the dashboard's own
  # origin. That is what makes "no CORS" structural rather than configured
  # (design/production.md -> "Same origin, two backends").
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      target: production
    image: fleetforge:dev
    container_name: fleetforge-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      # Since S0-infra-6 the flasher reads the agent bundles out of the store, so a dev
      # stack whose bucket does not exist yet cannot onboard a board. Ordering only: the
      # api itself starts fine without MinIO (it does no store I/O at startup and answers
      # a named 503 while the store is down) — this just spares the operator a confusing
      # first-run 503 in the one topology where we own the bucket's creation.
      minio-init:
        condition: service_completed_successfully
    environment:
      # Container URL, not the host URL from .env — see the header note.
      DATABASE_URL: postgresql+asyncpg://fleetforge:fleetforge@postgres:5432/fleetforge
      RUN_MIGRATIONS: "true"          # the api migrates; the ingestor must not
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      # The argon2id HASH of the admin password, never the password. Mandatory
      # here (`:?`) even though Settings treats it as optional: create_app() must
      # stay constructible with no environment, but a deployed stack must refuse
      # to start unconfigured rather than serve a login that can never succeed.
      #
      # NO DEFAULT ON PURPOSE — a shipped default admin credential is exactly the
      # wrong thing to have. And the value in .env must be SINGLE-QUOTED: compose
      # interpolates the `$argon2id`/`$v`/`$m` segments of an unquoted PHC string
      # away, leaving "=19=19456". Check with:
      #     docker compose config | grep -i ADMIN_PASSWORD_HASH
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env — see `just admin-password`}
      # The dynamic-security ADMIN credential — broker-root. It is what
      # `POST /v1/enroll` uses to create each device's client over
      # $CONTROL/dynamic-security/v1 (broker/dynsec.py). Mandatory (`${VAR:?}`,
      # no default): with it unset the API silently falls back to
      # `NullProvisioner`, every board enrolls with a credential the broker never
      # stored, and the only symptom is `broker_provisioned_at IS NULL`.
      MQTT_DYNSEC_USERNAME: ${MQTT_DYNSEC_USERNAME:?set MQTT_DYNSEC_USERNAME in .env}
      MQTT_DYNSEC_PASSWORD: ${MQTT_DYNSEC_PASSWORD:?set MQTT_DYNSEC_PASSWORD in .env}
      # The API's SECOND broker credential (R1-be-2): the `commander` client, the
      # only one in the estate allowed to publish `ff/v1/d/+/dn/#`. Separate from
      # the dynsec admin on purpose — broker-root is a control-plane credential and
      # a deploy is a data-plane publish. Mandatory (`${VAR:?}`): with it unset the
      # API selects `NullCommandPublisher` and every deploy answers 503, because a
      # deploy that publishes nothing and returns 202 is a lie.
      MQTT_COMMAND_USERNAME: ${MQTT_COMMAND_USERNAME:?set MQTT_COMMAND_USERNAME in .env}
      MQTT_COMMAND_PASSWORD: ${MQTT_COMMAND_PASSWORD:?set MQTT_COMMAND_PASSWORD in .env}
      # The HMAC key behind the PUBLIC download endpoint (R1-be-3): every
      # `GET /v1/artifact/{sha}/bin?exp=…&sig=…` is authorized by this and nothing else,
      # and every deploy mints a link with it. Mandatory (`${VAR:?}`, no default) for the
      # reason ADMIN_PASSWORD_HASH is: a shipped default here would be a forgeable link
      # on every install, and a stack that starts unconfigured just answers 503s nobody
      # diagnoses. Mint one with `just artifact-secret`.
      ARTIFACT_URL_SECRET: ${ARTIFACT_URL_SECRET:?set ARTIFACT_URL_SECRET in .env — see `just artifact-secret`}
      # The origin a DEVICE must be able to reach, which is what the link in a `stage`
      # command is built on — the same trap as S3_PUBLIC_ENDPOINT_URL below: a board
      # cannot resolve `api:8000`. Defaults to the host's published port, which is right
      # for the dev stack and for the simulator. A QEMU guest reaches the host at
      # 10.0.2.2, not localhost: export FF_PUBLIC_BASE_URL=http://10.0.2.2:8080 for an
      # OTA run against the emulator (docs/runbooks/agent-qemu.md).
      PUBLIC_BASE_URL: ${FF_PUBLIC_BASE_URL:-http://localhost:${FF_HTTP_PORT:-8080}}
      #
      # Pre-wired for R0-be-6 so the object-store adapter is pure code.
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-fleetforge}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-fleetforge}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-fleetforge-dev-only}
      # A presigned URL SIGNS THE HOST HEADER, so the URL a device is handed must be
      # generated against an endpoint reachable from OUTSIDE this network — the host's
      # published MinIO port in dev. Rewriting the host after signing invalidates the
      # signature, and the failure only shows up on a real board: from inside the
      # compose network `http://minio:9000` works perfectly.
      # Overridable for exactly the same reason as PUBLIC_BASE_URL above, and in exactly
      # the same shape: the QEMU guest reaches the host at 10.0.2.2, so an OTA run against
      # the emulator exports FF_S3_PUBLIC_ENDPOINT_URL=http://10.0.2.2:9000 alongside
      # FF_PUBLIC_BASE_URL. It was hard-coded until R1-fw-1, and the failure that cost was
      # a deploy that looked perfect server-side and a board that could not reach hop two.
      S3_PUBLIC_ENDPOINT_URL: ${FF_S3_PUBLIC_ENDPOINT_URL:-http://localhost:${FF_MINIO_PORT:-9000}}
      # NOT wired: production (R0-infra-3 / R1) selects the GCS backend instead, with
      #     GCS_BUCKET: btvaroska
      #     GCS_PREFIX: fleetforge/            # gs://btvaroska is SHARED — see below
      #     GCS_IMPERSONATE_SERVICE_ACCOUNT: fleetforge-artifacts@btvaroska.iam.gserviceaccount.com
      # and NO key file mounted at all (S0-infra-5). btvaroska inherits
      # constraints/iam.disableServiceAccountKeyCreation, so a key cannot be minted; the
      # container impersonates `fleetforge-artifacts` over the VM's attached identity,
      # which needs roles/iam.serviceAccountTokenCreator on that service account. That
      # email is not a credential, which is why it can sit here in plain sight.
      # Impersonation is also what CONTAINS us: `fleetforge-artifacts` is granted
      # objectAdmin under an IAM CONDITION limiting it to `…/objects/fleetforge/…`, while
      # the VM's own identity holds objectAdmin on the WHOLE bucket — which also holds
      # this estate's secrets/ backups and the boris podcast audio. Plain ADC is refused
      # for exactly that reason.
      # The legacy alternative, where a key can still be minted, is
      # `GCS_CREDENTIALS_FILE: /run/secrets/fleetforge-artifacts.json` with the key
      # mounted read-only — and THE CONTAINER RUNS AS NON-ROOT `appuser`, so a 0600
      # root-owned key mounted in is unreadable (mount it 0644 or chown it). Setting both
      # credentials is refused, not resolved.
      # Recipe and rotation: docs/runbooks/artifact-storage.md. Nothing in this repo's
      # compose mounts a real key, and none is ever committed.
      #
      # The prebuilt agent images live in that same store since S0-infra-6 — the app
      # image ships none — so the S3_* block above is now what ONBOARDING depends on,
      # not just deploy. Nothing to set here: AGENT_INDEX_KEY (agent/index.json) and
      # AGENT_CATALOG_TTL_S (60s, how long a `just agent-publish` takes to reach the
      # flasher with nothing restarted) default correctly. Publish into this stack with
      # `just agent-publish <target>`.
    # No published host port: the only way in is the frontend's nginx.
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  ingestor:
    # EXACTLY ONE INSTANCE. The ingestor is the sole MQTT subscriber
    # (design/production.md -> "The single-subscriber rule"): N subscribers would
    # ingest every message N times and split the SSE audience. Never scale this
    # service, and never subscribe from the api.
    build:
      context: .
      target: production
    image: fleetforge:dev
    container_name: fleetforge-ingestor
    restart: unless-stopped
    command: ["python", "-m", "fleetforge.ingestor.main"]
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fleetforge:fleetforge@postgres:5432/fleetforge
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      # This process's OWN broker credential (R0-sec-1) — a read-only dynsec role
      # scoped to `ff/v1/d/+/up/#`, deliberately NOT the API's dynsec admin.
      # Unset means anonymous, which the broker now refuses: the ingestor would
      # reconnect-loop with "Not authorized" and go unhealthy after 120 s.
      MQTT_USERNAME: ${MQTT_INGESTOR_USERNAME:?set MQTT_INGESTOR_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_INGESTOR_PASSWORD:?set MQTT_INGESTOR_PASSWORD in .env}
      # RUN_MIGRATIONS deliberately unset: two processes racing `alembic upgrade
      # head` on restart is a deadlock waiting for a slow migration.
    networks:
      - backend
    healthcheck:
      # No HTTP server to probe, so liveness is the heartbeat file the ingestor
      # touches on connect and after every message. R0-be-3 inherits this.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/ingestor-alive) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # The dashboard, and the only thing Traefik routes over HTTP. nginx serves the
  # SPA and proxies /v1/* to api:8000 on the same origin.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: production
    image: fleetforge-frontend:dev
    container_name: fleetforge-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.ff-frontend.rule: "Host(`${FF_DOMAIN:-localhost}`)"
      traefik.http.routers.ff-frontend.entrypoints: web
      traefik.http.services.ff-frontend.loadbalancer.server.port: "8080"
      # Must match the real compose-prefixed network name (`docker network ls`).
      # A wrong value is a 502 through Traefik while `docker compose exec` into
      # the container works fine — a genuinely confusing twenty minutes.
      traefik.docker.network: fleetforge_frontend
    networks:
      - frontend        # Traefik reaches nginx here
      - backend         # nginx reaches api:8000 here
    healthcheck:
      # 127.0.0.1, not `localhost`: nginx listens on IPv4 only, busybox wget tries
      # ::1 first and does not fall back, and Traefik silently skips a container
      # that is not healthy — which shows up as a 404 from the `web` entrypoint.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  frontend:
  backend:

volumes:
  fleetforge_pg:          # the dev database — do not rename, `just nuke` is the only wipe
  fleetforge_mosquitto:   # /mosquitto/data — persistent sessions must survive a restart
  fleetforge_minio:
